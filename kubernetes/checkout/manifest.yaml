apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout
          image: ghcr.io/open-telemetry/demo:3.1.0-checkout
          ports:
            - containerPort: 5050
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: CHECKOUT_PORT
              value: '5050'
            - name: GOMEMLIMIT
              value: 64MiB
            - name: OTEL_SERVICE_NAME
              value: checkout
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 500m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: 5050
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            grpc:
              port: 5050
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5050
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: grpc
      port: 5050
      targetPort: 5050
