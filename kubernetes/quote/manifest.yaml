apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quote
  template:
    metadata:
      labels:
        app: quote
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: quote
          image: ghcr.io/open-telemetry/demo:3.1.0-quote
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: QUOTE_PORT
              value: '8090'
            - name: OTEL_SERVICE_NAME
              value: quote
            - name: OTEL_PHP_AUTOLOAD_ENABLED
              value: 'true'
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8090
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: quote
spec:
  selector:
    app: quote
  ports:
    - name: http
      port: 8090
      targetPort: 8090
