receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 144
    spike_limit_mib: 32
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - >-
            delete_matching_keys(attributes,
            "(?i).*(email|card|cvv|password|token|authorization|cookie|user.id|db.connection_string|db.statement|db.query.text).*")
          - set(attributes["db.system"], attributes["db.system.name"]) where attributes["db.system.name"] != nil
          - set(attributes["db.name"], attributes["db.namespace"]) where attributes["db.namespace"] != nil
    metric_statements:
      - context: datapoint
        statements:
          - delete_matching_keys(attributes, "(?i).*(email|card|cvv|password|token|authorization|cookie|user.id).*")
    log_statements:
      - context: log
        statements:
          - delete_matching_keys(attributes, "(?i).*(email|card|cvv|password|token|authorization|cookie|user.id).*")
          - set(body, "Log body omitted by local telemetry privacy policy")
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 64
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true
  debug:
    verbosity: basic
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/privacy
        - batch
      exporters:
        - otlp/tempo
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/privacy
        - batch
      exporters:
        - prometheus
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - transform/privacy
        - batch
      exporters:
        - debug
