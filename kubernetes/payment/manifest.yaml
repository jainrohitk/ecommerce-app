apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment
          image: ghcr.io/open-telemetry/demo:3.1.0-payment
          ports:
            - containerPort: 50051
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: PAYMENT_PORT
              value: '50051'
            - name: OTEL_SERVICE_NAME
              value: payment
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 50051
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 50051
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    app: payment
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
