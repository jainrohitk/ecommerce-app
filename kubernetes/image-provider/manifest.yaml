apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-provider
  template:
    metadata:
      labels:
        app: image-provider
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-provider
          image: ghcr.io/open-telemetry/demo:3.1.0-image-provider
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: IMAGE_PROVIDER_PORT
              value: '8081'
            - name: OTEL_SERVICE_NAME
              value: image-provider
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /status
              port: 8081
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: image-provider
spec:
  selector:
    app: image-provider
  ports:
    - name: http
      port: 8081
      targetPort: 8081
