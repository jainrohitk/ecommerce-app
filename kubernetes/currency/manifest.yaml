apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: currency
  template:
    metadata:
      labels:
        app: currency
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: currency
          image: ghcr.io/open-telemetry/demo:3.1.0-currency
          ports:
            - containerPort: 7001
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: CURRENCY_PORT
              value: '7001'
            - name: OTEL_SERVICE_NAME
              value: currency
            - name: VERSION
              value: 3.1.0
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 7001
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 7001
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7001
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: currency
spec:
  selector:
    app: currency
  ports:
    - name: grpc
      port: 7001
      targetPort: 7001
