apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: email
          image: ghcr.io/open-telemetry/demo:3.1.0-email
          ports:
            - containerPort: 6060
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: EMAIL_PORT
              value: '6060'
            - name: APP_ENV
              value: production
            - name: OTEL_SERVICE_NAME
              value: email
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 6060
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 6060
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6060
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: email
spec:
  selector:
    app: email
  ports:
    - name: http
      port: 6060
      targetPort: 6060
