groups:
  - name: learning-lab
    rules:
      - alert: TelemetryTargetUnavailable
        expr: up == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A metrics target is unavailable
          description: Check the dedicated lab pods and network policies; missing data is not proof of healthy applications.
      - alert: CheckoutErrorRate
        expr: |
          sum(rate(traces_spanmetrics_calls_total{service="checkout",span_kind="SPAN_KIND_SERVER",status_code="STATUS_CODE_ERROR"}[5m]))
          / sum(rate(traces_spanmetrics_calls_total{service="checkout",span_kind="SPAN_KIND_SERVER"}[5m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of observed checkout server spans have errors
          description: Use the Tempo service map and traces to investigate. This learning alert is not a business-correctness SLO.
