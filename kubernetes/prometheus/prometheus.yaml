global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: application-otel-metrics
    static_configs:
      - targets:
          - otel-collector:8889
  - job_name: redis
    static_configs:
      - targets:
          - redis:9121
  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
