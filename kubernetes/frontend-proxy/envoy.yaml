admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 10000
static_resources:
  listeners:
    - name: storefront
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: storefront
                codec_type: AUTO
                tracing:
                  spawn_upstream_span: true
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      '@type': type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      service_name: frontend-proxy
                      grpc_service:
                        envoy_grpc:
                          cluster_name: otlp-grpc
                        timeout: 1s
                route_config:
                  name: storefront
                  virtual_hosts:
                    - name: storefront
                      domains:
                        - '*'
                      routes:
                        - match:
                            prefix: /images/
                          route:
                            cluster: images
                            prefix_rewrite: /
                            timeout: 15s
                        - match:
                            prefix: /otlp-http/v1/traces
                          route:
                            cluster: otlp-http
                            prefix_rewrite: /v1/traces
                            timeout: 5s
                        - match:
                            prefix: /flagservice/
                          route:
                            cluster: flags
                            prefix_rewrite: /
                            timeout: 5s
                        - match:
                            prefix: /
                          route:
                            cluster: frontend
                            timeout: 15s
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: frontend
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: frontend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: frontend
                      port_value: 8080
    - name: images
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: images
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: image-provider
                      port_value: 8081
    - name: otlp-http
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: otlp-http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: otel-collector
                      port_value: 4318
    - name: otlp-grpc
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: otlp-grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: otel-collector
                      port_value: 4317
    - name: flags
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: flags
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: flagd
                      port_value: 8013
