apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-proxy
  template:
    metadata:
      labels:
        app: frontend-proxy
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.39.1
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --log-level
            - warn
            - --concurrency
            - '1'
          ports:
            - containerPort: 8080
            - containerPort: 10000
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 10000
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-proxy
spec:
  type: NodePort
  selector:
    app: frontend-proxy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
