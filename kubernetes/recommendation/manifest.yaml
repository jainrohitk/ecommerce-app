apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommendation
  template:
    metadata:
      labels:
        app: recommendation
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recommendation
          image: ghcr.io/open-telemetry/demo:3.1.0-recommendation
          ports:
            - containerPort: 9001
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: RECOMMENDATION_PORT
              value: '9001'
            - name: OTEL_SERVICE_NAME
              value: recommendation
            - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
              value: python
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 9001
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 9001
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9001
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation
spec:
  selector:
    app: recommendation
  ports:
    - name: grpc
      port: 9001
      targetPort: 9001
