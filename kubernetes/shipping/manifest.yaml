apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping
  template:
    metadata:
      labels:
        app: shipping
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shipping
          image: ghcr.io/open-telemetry/demo:3.1.0-shipping
          ports:
            - containerPort: 50050
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: SHIPPING_PORT
              value: '50050'
            - name: OTEL_SERVICE_NAME
              value: shipping
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: 50050
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 50050
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50050
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
spec:
  selector:
    app: shipping
  ports:
    - name: http
      port: 50050
      targetPort: 50050
