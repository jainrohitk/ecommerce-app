apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagd
  template:
    metadata:
      labels:
        app: flagd
        tier: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flagd
          image: ghcr.io/open-feature/flagd:v0.16.0
          args:
            - start
            - --uri
            - file:/etc/flagd/flags.json
          ports:
            - containerPort: 8013
            - containerPort: 8016
          envFrom:
            - configMapRef:
                name: app-env
          env:
            - name: OTEL_SERVICE_NAME
              value: flagd
            - name: GOMEMLIMIT
              value: 64MiB
          volumeMounts:
            - name: config
              mountPath: /etc/flagd
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 500m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: 8013
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: flagd-config
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
spec:
  selector:
    app: flagd
  ports:
    - name: grpc
      port: 8013
      targetPort: 8013
    - name: ofrep
      port: 8016
      targetPort: 8016
